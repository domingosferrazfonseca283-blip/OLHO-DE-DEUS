name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compilar OLHO DE DEUS
        run: pyinstaller --clean --noconfirm build.spec

      - name: Empacotar
        shell: powershell
        run: |
          Compress-Archive `
            -Path dist\OLHO_DE_DEUS.exe `
            -DestinationPath OLHO_DE_DEUS-Windows.zip

      - name: Publicar executável
        uses: actions/upload-artifact@v4
        with:
          name: OLHO_DE_DEUS-Windows
          path: OLHO_DE_DEUS-Windows.zip
